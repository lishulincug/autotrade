name: 更新基金净值和策略仪表盘
on:
  # 每周一、三、五北京时间 09:45；手动运行和 main 推送也执行更新。
  schedule:
    - cron: '45 1 * * 1,3,5'
  # 允许网页上手动点按钮触发调试，非常重要
  workflow_dispatch:
  # main 分支有推送时同步构建部署
  push:
    branches: [main]

concurrency:
  group: fund-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 拉取仓库源码(main分支)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装项目python依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 验证净值更新逻辑
        run: python -m unittest discover -s tests -p 'test_update_fund_nav.py'

      - name: 增量更新基金净值（最多 4 分钟）
        id: nav
        timeout-minutes: 4
        continue-on-error: true
        run: python -u update_fund_nav.py --max-seconds 180 --fund-timeout 20

      - name: 提交成功更新的基金缓存到 main
        env:
          NAV_OUTCOME: ${{ steps.nav.outcome }}
        run: |
          git add -- .data_cache/fund_*_2019-01-01_2026-12-31.csv
          if git diff --cached --quiet; then
            echo "No NAV cache changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): incrementally update fund NAV"
            git push origin HEAD:main
          fi
          echo "NAV update outcome: $NAV_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: 更新失败时停止部署并标记流水线失败
        if: steps.nav.outcome != 'success'
        run: |
          echo "NAV update failed or timed out. See the update log for affected funds."
          exit 1

      - name: 执行gf_run.sh，生成gf_strategy_dashboard.html
        run: |
          chmod +x gf_run.sh
          bash gf_run.sh

      - name: 组装 gh-pages 静态站点（统一入口 + 各策略页）
        run: |
          mkdir -p gh-pages/web_dashboard
          cp index.html dashboards.json gh-pages/
          cp dual_bottom_dashboard.html dual_bottom_ladder_dashboard.html gh-pages/
          cp gf_strategy_dashboard.html gh-pages/
          cp web_dashboard/index.html web_dashboard/dashboard_data.json gh-pages/web_dashboard/

      - name: 把生成的html部署到gh-pages分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
